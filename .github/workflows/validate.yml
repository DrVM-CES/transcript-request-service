name: Transcript validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      DATABASE_URL: 'file:./.data/build-only.db'
      TURSO_AUTH_TOKEN: ''
      RESEND_API_KEY: 're_test_build_only'
      MFC_API_KEY: 'test-build-only'
      NEXT_PUBLIC_APP_URL: 'http://localhost:3001'
      TRANSCRIPT_ENVIRONMENT: 'staging'
      TRANSCRIPT_DELIVERY_MODE: 'disabled'
      TRANSCRIPT_PUBLIC_SUBMISSIONS_ENABLED: 'false'
      PARCHMENT_SFTP_HOST: ''
      PARCHMENT_SFTP_USERNAME: ''
      PARCHMENT_SFTP_PASSWORD: ''
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false
      - name: Remove deployment configuration from disposable checkout
        run: |
          rm -f -- .env .env.local .env.production .env.production.local
          mkdir -p .data
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
